<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Munchify - Cupones y recompensas por interacción digital.">
  <meta name="theme-color" content="#09090B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Munchify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Munchify</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #09090B; }
    #cargando {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      color: #A1A1AA; font: 500 15px system-ui, -apple-system, sans-serif;
    }
    #cargando img { width: 88px; height: 88px; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="cargando">
    <img src="icons/Icon-192.png" alt="">
    <span>Cargando Munchify…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var aviso = document.getElementById('cargando');
      if (aviso) aviso.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
