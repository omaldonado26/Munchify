<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Munchify - Cupones y recompensas por interacción digital.">
  <meta name="theme-color" content="#09090B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Munchify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Munchify</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fondo negro desde el primer instante, para que no se vea una pantalla blanca mientras carga. */
    html, body { margin: 0; height: 100%; background: #09090B; }
    #cargando {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      color: #A1A1AA; font: 500 15px system-ui, -apple-system, sans-serif;
    }
    #cargando img { width: 88px; height: 88px; border-radius: 20px; }
  </style>
</head>
<body>
  <!-- Aviso de carga: la primera vez la app tarda unos segundos en descargarse. -->
  <div id="cargando">
    <img src="icons/Icon-192.png" alt="">
    <span>Cargando Munchify…</span>
  </div>
  <script>
    // Flutter avisa cuando dibuja su primera pantalla; ahí se quita el aviso de carga.
    window.addEventListener('flutter-first-frame', function () {
      var aviso = document.getElementById('cargando');
      if (aviso) aviso.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
